<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sera Messenger</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 320px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .header { padding: 12px 15px; background: #252525; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; font-size: 14px; }
    .search-box { padding: 10px; background: #1e1e1e; }
    .search-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
    
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #282828; }
    .chat-item:hover, .chat-item.active { background: #2c2c2c; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #007bff; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Main Chat Area */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #181818; }
    .chat-header { padding: 15px; background: #252525; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .call-btns { display: flex; gap: 10px; }
    .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; background: #007bff; color: #fff; font-size: 13px; }
    .btn-secondary { background: #444; }
    .btn-danger { background: #dc3545; }

    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg.my { align-self: flex-end; background: #007bff; color: #fff; }
    .msg.their { align-self: flex-start; background: #2a2a2a; color: #fff; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

    .input-area { padding: 15px; background: #252525; display: flex; gap: 10px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; color: #fff; outline: none; }
    
    /* Call Overlay */
    .call-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    .videos { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    video { width: 300px; height: 225px; background: #000; border-radius: 12px; object-fit: cover; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="header">
      <span id="user-display">Гость</span>
      <div style="display: flex; gap: 5px;">
        <button class="btn btn-secondary" onclick="setApiKey()">Ключ ИИ</button>
        <button class="btn hidden" id="login-btn" onclick="login()">Войти</button>
        <button class="btn btn-danger hidden" id="logout-btn" onclick="logout()">Выйти</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск контактов..." oninput="searchUsers()">
    </div>
    <div class="chat-list" id="chat-list">
      <!-- AI Bot Pinned -->
      <div class="chat-item" onclick="openChat('ai_bot', 'Sera AI (Бот)')">
        <div class="avatar" style="background:#6f42c1;">🤖</div>
        <div><strong>Sera AI (Бот)</strong><br><small style="color:#aaa;">Нейросеть</small></div>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main-chat">
    <div class="chat-header" id="chat-header">
      <h3 id="current-chat-title">Выберите контакт</h3>
      <div class="call-btns hidden" id="call-btns">
        <button class="btn btn-secondary" onclick="startCall(false)">📞 Аудио</button>
        <button class="btn" onclick="startCall(true)">📹 Видео</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area hidden" id="input-area">
      <label class="btn btn-secondary" style="cursor:pointer; display:flex; align-items:center; justify-content:center;">
        📷 <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="sendPhoto(this)">
      </label>
      <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="btn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- Video/Voice Call Modal -->
  <div class="call-overlay" id="call-overlay">
    <div class="videos">
      <video id="local-video" autoplay muted></video>
      <video id="remote-video" autoplay></video>
    </div>
    <button class="btn btn-danger" onclick="endCall()">Завершить звонок</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Инициализация Firebase (Твои ключи)
    const firebaseConfig = {
      apiKey: "AIzaSy...", // Не забудь вставить свой реальный apiKey если менял
      authDomain: "masenger-656fe.firebaseapp.com",
      projectId: "masenger-656fe",
      storageBucket: "masenger-656fe.appspot.com",
      messagingSenderId: "312061552783",
      appId: "1:312061552783:web:..."
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentChatId = null;
    let allUsers = [];
    let peer = null;
    let currentCall = null;
    let localStream = null;

    // Проверка результата редиректа
    getRedirectResult(auth).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-display').innerText = user.displayName || 'Профиль';
        document.getElementById('login-btn').classList.add('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        
        // Сохраняем пользователя в базу для поиска
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: user.displayName || "Аноним",
          email: user.email,
          photoURL: user.photoURL || ""
        }, { merge: true });

        initPeerJS();
        loadUsers();
      } else {
        currentUser = null;
        document.getElementById('user-display').innerText = 'Гость';
        document.getElementById('login-btn').classList.remove('hidden');
        document.getElementById('logout-btn').classList.add('hidden');
      }
    });

    // Функция входа
    window.login = function() {
      // На мобильных используем popup или redirect
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        signInWithRedirect(auth, provider);
      } else {
        signInWithPopup(auth, provider).catch(err => {
          console.error(err);
          signInWithRedirect(auth, provider);
        });
      }
    }

    // Функция выхода
    window.logout = function() {
      signOut(auth).then(() => {
        location.reload();
      });
    }

    // Загрузка зарегистрированных пользователей
    async function loadUsers() {
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        allUsers = [];
        querySnapshot.forEach((docSnap) => {
          if (currentUser && docSnap.id !== currentUser.uid) {
            allUsers.push(docSnap.data());
          }
        });
      } catch(e) {
        console.error("Ошибка загрузки пользователей:", e);
      }
    }

    // Поиск пользователей
    window.searchUsers = function() {
      const text = document.getElementById('search-input').value.toLowerCase();
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = '';

      if (!text.trim()) return;

      const filtered = allUsers.filter(u => u.name.toLowerCase().includes(text));
      filtered.forEach(u => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => openChat(u.uid, u.name);
        item.innerHTML = `
          <div class="avatar">${u.photoURL ? `<img src="${u.photoURL}">` : u.name[0]}</div>
          <div><strong>${u.name}</strong></div>
        `;
        resultsContainer.appendChild(item);
      });
    }

    // Открытие чата
    window.openChat = function(chatId, chatName) {
      currentChatId = chatId;
      document.getElementById('current-chat-title').innerText = chatName;
      document.getElementById('input-area').classList.remove('hidden');
      
      if (chatId === 'ai_bot') {
        document.getElementById('call-btns').classList.add('hidden');
        loadAiMessages();
      } else {
        document.getElementById('call-btns').classList.remove('hidden');
        listenForMessages();
      }
    }

    let unsubscribe = null;
    function listenForMessages() {
      if (!currentUser) return;
      if (unsubscribe) unsubscribe();
      const chatIdPair = [currentUser.uid, currentChatId].sort().join('_');
      const q = query(collection(db, "chats", chatIdPair, "messages"), orderBy("timestamp", "asc"));
      
      unsubscribe = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          renderMessage(data.text, data.senderId === currentUser.uid ? 'my' : 'their', data.image);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    // Загрузка сообщений для бота
    function loadAiMessages() {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      renderMessage("Привет! Я Sera AI — твой личный ИИ-помощник. Чем могу помочь?", 'their');
    }

    // Отправка текстового сообщения
    window.sendMessage = async function() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;
      input.value = '';

      if (currentChatId === 'ai_bot') {
        renderMessage(text, 'my');
        const aiReply = await queryGeminiAI(text);
        renderMessage(aiReply, 'their');
      } else {
        if (!currentUser) {
          alert("Сначала войдите в систему!");
          return;
        }
        const chatIdPair = [currentUser.uid, currentChatId].sort().join('_');
        await addDoc(collection(db, "chats", chatIdPair, "messages"), {
          senderId: currentUser.uid,
          text: text,
          timestamp: serverTimestamp()
        });
      }
    }

    // Отправка фотографий
    window.sendPhoto = function(input) {
      const file = input.files[0];
      if (!file || !currentChatId) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Img = e.target.result;
        if (currentChatId === 'ai_bot') {
          renderMessage('', 'my', base64Img);
          renderMessage('Я пока могу отвечать только на текст!', 'their');
        } else {
          if (!currentUser) return;
          const chatIdPair = [currentUser.uid, currentChatId].sort().join('_');
          await addDoc(collection(db, "chats", chatIdPair, "messages"), {
            senderId: currentUser.uid,
            image: base64Img,
            timestamp: serverTimestamp()
          });
        }
      };
      reader.readAsDataURL(file);
    }

    function renderMessage(text, side, image = null) {
      const container = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = `msg ${side}`;
      if (text) msg.innerText = text;
      if (image) {
        const img = document.createElement('img');
        img.src = image;
        msg.appendChild(img);
      }
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    // Gemini AI
    window.setApiKey = function() {
      const key = prompt("Вставьте ваш API Key Gemini (бесплатно в Google AI Studio):");
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert("Ключ успешно сохранен!");
      }
    }

    async function queryGeminiAI(promptText) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) return "Ошибка: Укажите API ключ ИИ через кнопку «Ключ ИИ» вверху!";
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "Ошибка соединения с ИИ. Проверьте правильность ключа.";
      }
    }

    // PeerJS Звонки
    function initPeerJS() {
      if (!currentUser) return;
      peer = new Peer(currentUser.uid);
      
      peer.on('call', async (call) => {
        if (confirm("Входящий звонок! Ответить?")) {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          localStream = stream;
          document.getElementById('local-video').srcObject = stream;
          document.getElementById('call-overlay').style.display = 'flex';
          
          call.answer(stream);
          call.on('stream', (remoteStream) => {
            document.getElementById('remote-video').srcObject = remoteStream;
          });
          currentCall = call;
        }
      });
    }

    window.startCall = async function(isVideo) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('local-video').srcObject = localStream;
        document.getElementById('call-overlay').style.display = 'flex';

        const call = peer.call(currentChatId, localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
        currentCall = call;
      } catch(e) {
        alert("Не удалось получить доступ к камере/микрофону!");
      }
    }

    window.endCall = function() {
      if (currentCall) currentCall.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      document.getElementById('call-overlay').style.display = 'none';
    }
  </script>
</body>
</html>
